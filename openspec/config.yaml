# OpenSpec: конфигурация единого репозитория спецификаций.
#
# Как это работает (проверено на OpenSpec 1.13.1):
#   - context  — попадает в инструкции ВСЕХ артефактов (proposal, specs, design, tasks);
#   - rules.<artifact> — только в инструкции своего артефакта;
#   - operations.*.guidance — рекомендации для apply/archive, не проверки.
# Подключить файл в context нельзя — только текст. Поэтому context короткий и
# содержит обязательный список доменных файлов, которые агент читает сам.
# Пути ниже — от корня specs-repo.

schema: spec-driven

context: |
  Проект: единый репозиторий спецификаций для всех сервисов. Язык артефактов — русский;
  идентификаторы, имена API, топиков, таблиц и классов — как в коде.

  ОБЯЗАТЕЛЬНО перед созданием любого артефакта прочитай:
    - domain/00-start-here.md          — навигация, запреты, инварианты, правила имён и архивации
    - domain/01-product-context.md     — продукты, роли, сценарии, что нельзя ломать
    - domain/02-domain-glossary.md     — термины, справочники, БД, Kafka, аудит, API
  По необходимости:
    - domain/03-architecture.md        — для design и изменений контрактов
    - domain/04-security-and-compliance.md — для R3+, данных, ПДн, прав
    - domain/05-testing-and-quality.md — для сценариев и tasks
    - adr/                             — принятые архитектурные решения
  Доменные файлы и ADR главнее общих знаний модели. Противоречие с ними — не обходить,
  а явно вынести в Open Questions.

  Структура спек: openspec/specs/<service>/<capability>/spec.md, где <service> — код
  сервиса из реестра в domain/00-start-here.md. Изменение нескольких сервисов — один change
  с дельтами в каждом затронутом <service>/<capability>.

  Имя change: <service>-<глагол>-<объект> (например billing-add-refund); для изменений
  нескольких сервисов — platform-<глагол>-<объект>. Только строчные латинские буквы, цифры
  и одиночные дефисы.

  Процесс: change ревьюится и вливается отдельным PR в этот репозиторий (PR #1) до начала
  разработки. Код пишется в репозитории сервиса через пайплайн harness (/workflow), а не
  через /opsx:apply.

rules:
  proposal:
    - "Why — бизнес-язык из intent автора: какая проблема, для кого, почему сейчас. Без решений реализации."
    - "Обязательная строка 'Risk class: R<0-5>' с обоснованием по четырём осям /risk-classify: данные (public / internal / pii / secret / regulated), среда (dev / staging / prod), радиус влияния (модуль / сервис / несколько сервисов / платформа), регуляторика (нет / конкретная регуляция). При сомнении — класс выше."
    - "R0/R1 change не требуют: если оценка получилась R0/R1, сообщи об этом и не создавай change."
    - "Обязательная строка 'Story: <ключ>' — ключ story Jira из строки Story intent (несколько — через запятую). По ней цикл тестирования связывает релиз со спекой; без неё критерии change не попадут в тест-модель. Story нет — спроси автора, не выдумывай ключ."
    - "Impact — список затронутых '<service>/<capability>' и внешних контрактов (API, Kafka, БД). Изменения нескольких сервисов перечисли явно."
    - "Обязательный раздел Non-goals: что сознательно не входит в change."
    - "Сверься с разделом 'Что нельзя ломать' из domain/01-product-context.md и перечисли затронутые пункты; если не затронуто ничего — так и напиши."
    - "Если change требует нового архитектурного решения или отступает от domain/03-architecture.md — укажи, что нужен ADR."

  specs:
    - "Дельта лежит в specs/<service>/<capability>/spec.md. Перед созданием новой capability проверь существующие (openspec list --specs) и расширяй подходящую."
    - "Каждое Requirement сформулировано через SHALL/MUST и имеет минимум один Scenario."
    - "Заголовок сценария: '#### Scenario: AC-<n> <бизнесовое описание поведения>'. Номер n уникален в пределах change и не переиспользуется."
    - "Сценарий в формате WHEN/THEN (GIVEN — для предусловий). Один сценарий — одно проверяемое поведение."
    - "Для валидации, ошибок, прав доступа и граничных значений обязательны негативные сценарии."
    - "Используй только термины из domain/02-domain-glossary.md. Новый термин — добавь его в глоссарий в этом же PR."
    - "MODIFIED Requirement копируется целиком вместе со всеми сценариями: при archive блок заменяется полностью, и пропущенные сценарии потеряются."
    - "REMOVED Requirement содержит Reason и Migration."
    - "В спеке — наблюдаемое поведение. Классы, таблицы, внутренние вызовы — в design."

  design:
    - "design.md обязателен для R3+, изменений нескольких сервисов, новых зависимостей, миграций БД и изменений API/Kafka-контрактов. Иначе — по необходимости."
    - "Перечисли затронутые модули и пакеты по каждому сервису — это заменяет отдельный план реализации."
    - "Проверь соответствие domain/03-architecture.md: обязательные паттерны соблюдены, запрещённые не используются. Отступление — только с ADR."
    - "Контракты: для API, Kafka и БД опиши обратную совместимость и порядок выкатки сервисов (contract-first: контракт и миграция раньше потребителей)."
    - "Для R3+ — раздел безопасности по domain/04-security-and-compliance.md: какие данные затронуты, ПДн, права, угрозы."
    - "Обязательны разделы Risks / Trade-offs, Rollback plan и Open Questions."

  tasks:
    - "Группируй задачи по сервисам: '## <n>. <service>: <что делаем>'. Порядок contract-first: контракты и миграции → поставщик → потребители."
    - "TDD-пары: для каждого AC-<n> сначала задача 'Тест: AC-<n> ...', затем 'Реализация: AC-<n> ...'."
    - "У задачи 'Тест' укажи уровень по domain/05-testing-and-quality.md (unit, slice, integration)."
    - "Задача атомарна и выполнима примерно за 2 часа; каждая ссылается на AC-<n> или на раздел design."
    - "Последняя группа — проверки: сборка, линтеры, обновление документации и глоссария."
    - "Никаких задач вне scope proposal."

operations:
  apply:
    guidance:
      - "В этом репозитории код не пишется. Реализация change — в репозитории сервиса через /workflow <change-id> harness."
  archive:
    guidance:
      - "Archive выполняется только после merge кода всех затронутых сервисов и при наличии evidence по каждому из них."
      - "Перед archive сделай rebase на main: параллельный change мог изменить те же требования."
